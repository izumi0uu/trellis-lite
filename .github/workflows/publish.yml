name: Publish Trellis Lite to npm

# npm publication is intentionally separate from GitHub Releases. Run this
# workflow only after the fork owner has configured the NPM_TOKEN repository
# secret. A GitHub source release must not fail merely because npm credentials
# are absent.
on:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref_name || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance attestations.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version alignment (core, cli, git tag)
        run: node packages/cli/scripts/release-preflight.js check-versions --require-tag

      - name: Typecheck (core + cli)
        run: pnpm typecheck

      # Build before test: integration tests spawn the real CLI via
      # bin/trellis-lite.js imports dist/ and needs build output to exist.
      - name: Build (core then cli)
        run: pnpm build

      - name: Test (core + cli)
        run: pnpm test

      - name: Verify packed CLI pins core to exact version
        run: node packages/cli/scripts/release-preflight.js verify-packed-cli

      - name: Compute publish plan
        id: plan
        run: node packages/cli/scripts/release-preflight.js publish-plan --github

      - name: Publish trellis-lite-core
        if: steps.plan.outputs.core_publish == 'true'
        run: pnpm publish --access public --no-git-checks --tag ${{ steps.plan.outputs.tag }}
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Skip trellis-lite-core (already on npm)
        if: steps.plan.outputs.core_publish != 'true'
        run: echo "trellis-lite-core@${{ steps.plan.outputs.version }} already published; skipping."

      - name: Publish trellis-lite
        if: steps.plan.outputs.cli_publish == 'true'
        run: pnpm publish --access public --no-git-checks --tag ${{ steps.plan.outputs.tag }}
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Skip trellis-lite (already on npm)
        if: steps.plan.outputs.cli_publish != 'true'
        run: echo "trellis-lite@${{ steps.plan.outputs.version }} already published; skipping."

      - name: Verify published packages on public npm
        run: node packages/cli/scripts/release-preflight.js verify-npm --package all
